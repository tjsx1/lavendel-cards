name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      # Die HACS-Action liest das Repository über die GitHub-API;
      # ein Checkout ist dafür nicht nötig.
      - name: HACS-Prüfung
        uses: hacs/action@main
        with:
          category: plugin

  syntax:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Die Karten liegen in einer einzigen Datei in der Wurzel des
      # Repositoriums. Zum Prüfen als ES-Modul umbenennen.
      - name: Syntax prüfen
        run: |
          cp onyx-cards.js /tmp/check.mjs
          node --check /tmp/check.mjs
