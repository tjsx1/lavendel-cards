# Lavendel — Theme für Home Assistant
# Ablage:  /config/themes/lavendel.yaml
#
# In der configuration.yaml muss einmal stehen:
#   frontend:
#     themes: !include_dir_merge_named themes
#
# Danach: Entwicklerwerkzeuge → YAML → "Themes neu laden"
# und im Benutzerprofil unten "Lavendel" auswählen.

lavendel:
  # ---------- Akzent ----------
  primary-color: "#7b6bf0"
  accent-color: "#e7599b"
  dark-primary-color: "#5b4bc4"
  light-primary-color: "#a89ff0"

  # ---------- Hintergrund & Flächen ----------
  primary-background-color: "#9186e4"
  secondary-background-color: "#9186e4"
  lovelace-background: "radial-gradient(120% 80% at 15% 0%, #a79cf0 0%, transparent 55%), radial-gradient(100% 70% at 90% 100%, #7e70dd 0%, transparent 60%), #9186e4"
  card-background-color: "#f7f7fa"
  ha-card-background: "#f7f7fa"
  ha-card-border-radius: "20px"
  ha-card-border-width: "0"
  ha-card-box-shadow: "none"

  # ---------- Text ----------
  primary-text-color: "#1c1c22"
  secondary-text-color: "#6b6b78"
  text-primary-color: "#ffffff"
  disabled-text-color: "#a3a3b0"
  divider-color: "#ebebf1"

  # ---------- Kopfzeile ----------
  app-header-background-color: "transparent"
  app-header-text-color: "#ffffff"
  app-header-edit-background-color: "#7b6bf0"

  # ---------- Icons & Zustände ----------
  state-icon-color: "#6b6b78"
  state-icon-active-color: "#7b6bf0"
  paper-item-icon-color: "#6b6b78"
  paper-item-icon-active-color: "#7b6bf0"
  switch-checked-color: "#7b6bf0"
  slider-color: "#7b6bf0"
  slider-track-color: "#e6e6ee"

  # ---------- Eigene Variablen der Lavendel-Karten ----------
  # Diese Werte lesen lavendel-room-card, -slider-card und -cover-card aus.
  lav-grad: "linear-gradient(135deg,#4ec5e8 0%,#7b6bf0 52%,#e7599b 100%)"
  lav-glow: "0 6px 16px rgba(123,107,240,0.35)"
  lav-soft: "0 2px 10px rgba(80,66,160,0.07)"
  lav-card-on: "#ffffff"
  lav-flat: "rgba(120,120,140,0.10)"
  lav-ink3: "#a3a3b0"
  lav-radius: "20px"
  lav-font: "Poppins, system-ui, sans-serif"

  # ---------- Abstände im Sections-Raster ----------
  ha-view-sections-column-gap: "12px"
  ha-view-sections-row-gap: "12px"
